{% extends "base.html" %}

{% block title %}{{ _('register') }} - {{ _('Bus Reservation System') }}{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="custom-card p-4 p-md-5 shadow-sm">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-success-subtle text-success d-inline-flex align-items-center justify-content-center mb-2" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold">{{ _('passenger_registration') }}</h3>
                    <p class="text-muted small">{{ _('register_sub') }}</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">{{ _('full_name') }} <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" 
                                   placeholder="e.g. John Doe" value="{{ name or '' }}" required autofocus>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">{{ _('email_address') }} <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" 
                                       placeholder="name@example.com" value="{{ email or '' }}" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">{{ _('phone_number') }} <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control" id="phone" name="phone" 
                                       placeholder="10-digit mobile" value="{{ phone or '' }}" pattern="[0-9]{10}" maxlength="15" required>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="password" class="form-label fw-semibold">{{ _('password') }} <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" 
                                       placeholder="{{ _('min_6_chars') }}" minlength="6" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="confirm_password" class="form-label fw-semibold">{{ _('confirm_password') }} <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-shield-check"></i></span>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" 
                                       placeholder="{{ _('confirm_new_password') }}" minlength="6" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required checked>
                        <label class="form-check-label small text-muted" for="terms">
                            {{ _('terms_agreement') }}
                        </label>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-check2-circle me-1"></i> {{ _('register') }}
                    </button>
                </form>

                <div class="text-center border-top pt-3">
                    <p class="small text-muted mb-0">{{ _('already_registered') }} <a href="{{ url_for('auth.login') }}" class="text-primary fw-semibold">{{ _('sign_in') }}</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
