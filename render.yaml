services:
  - type: web
    name: bus-reservation-system
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 run:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_PAYMENT_MODE
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: bus-reservation-db
          property: connectionString

databases:
  - name: bus-reservation-db
    databaseName: bus_reservation
    user: bus_admin
    plan: free
